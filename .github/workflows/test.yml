name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check bash syntax
        run: |
          for script in installer upgrade uninstaller services/traefik/.bash_enter.d/*; do
            bash -n "$script"
          done

      - name: Shellcheck
        run: shellcheck --severity=error installer upgrade uninstaller

  ddb-repository:
    name: ddb repository configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check core.github_repository stays aligned
        run: |
          stub="$RUNNER_TEMP/stub"
          mkdir -p "$stub"
          for command in docker ddb; do
            printf '#!/usr/bin/env bash\nexit 0\n' > "$stub/$command"
          done
          printf '#!/usr/bin/env bash\nwhile [[ $# -gt 0 ]]; do [[ "$1" == "-o" ]] && echo stub > "$2"; shift; done\nexit 0\n' > "$stub/curl"
          chmod +x "$stub"/*

          home="$RUNNER_TEMP/devbox"

          install() {
            env -i PATH="$stub:/usr/bin:/bin" HOME="$RUNNER_TEMP/fakehome" DOCKER_DEVBOX_HOME="$home" \
              ${1:+DOCKER_DEVBOX_DDB_REPOSITORY=$1} \
              DOCKER_DEVBOX_DDB_VERSION=v3.1.0 DOCKER_DEVBOX_MINIMAL=1 \
              DOCKER_DEVBOX_DISABLE_OPTIONAL_DEPENDENCIES=1 DOCKER_DEVBOX_SKIP_DOCKER_CHECKS=1 \
              bash ./installer > /dev/null
          }

          assert_repository() {
            if ! grep -qx "  github_repository: $1" "$home/ddb.yml"; then
              echo "expected core.github_repository to be $1"
              cat "$home/ddb.yml"
              exit 1
            fi
          }

          rm -rf "$home"
          install Toilal/docker-devbox-ddb
          assert_repository Toilal/docker-devbox-ddb

          install someone/else
          assert_repository someone/else

          install ""
          assert_repository inetum-orleans/docker-devbox-ddb

          rm -rf "$home"
          mkdir -p "$home"
          printf 'core:\n  domain:\n    ext: test\ndocker:\n  ip: 172.17.0.1\n' > "$home/ddb.yml"
          install Toilal/docker-devbox-ddb
          assert_repository Toilal/docker-devbox-ddb
          grep -q "ext: test" "$home/ddb.yml"
          grep -q "ip: 172.17.0.1" "$home/ddb.yml"

          rm -rf "$home"
          install ""
          test ! -e "$home/ddb.yml"

  install:
    name: Install ${{ matrix.mode }} from ${{ matrix.source }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: minimal
            source: checkout
          - mode: full
            source: checkout
          - mode: full
            source: repository
    env:
      DOCKER_DEVBOX_CURL_OPTS_GITHUB_API: -u x-access-token:${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup installation source
        run: |
          if [[ "${{ matrix.mode }}" == "minimal" ]]; then
            echo "DOCKER_DEVBOX_CI=1" >> "$GITHUB_ENV"
          fi

          if [[ "${{ matrix.source }}" == "repository" ]]; then
            # Publish the working tree as a git repository so the installer clones its services from it,
            # exercising the "curl | bash" code path without depending on a pushed branch.
            SOURCES="$RUNNER_TEMP/sources"
            mkdir -p "$SOURCES"
            tar -c --exclude=.git . | tar -x -C "$SOURCES"
            git -C "$SOURCES" init -q -b ci
            git -C "$SOURCES" add -A
            git -C "$SOURCES" -c user.email=ci@example.com -c user.name=ci commit -qm ci
            git clone -q --bare "$SOURCES" "$RUNNER_TEMP/docker-devbox.git"
            echo "DOCKER_DEVBOX_REPOSITORY=$RUNNER_TEMP/docker-devbox.git" >> "$GITHUB_ENV"
            echo "DOCKER_DEVBOX_BRANCH=ci" >> "$GITHUB_ENV"
          fi

      - name: Install
        run: |
          if [[ "${{ matrix.source }}" == "repository" ]]; then
            bash < ./installer
          else
            ./installer
          fi
          echo "$HOME/.docker-devbox/bin" >> "$GITHUB_PATH"

      - name: Check ddb is installed
        run: |
          test -x "$HOME/.docker-devbox/bin/ddb"
          ddb --version
          docker network inspect reverse-proxy > /dev/null

      - name: Check nothing else is installed
        if: matrix.mode == 'minimal'
        run: |
          for service in traefik cfssl portainer; do
            if [[ -e "$HOME/.docker-devbox/$service" ]]; then
              echo "$service should not be installed in minimal mode"
              exit 1
            fi
          done
          test ! -e "$HOME/.docker-devbox/.src"
          test -z "$(docker ps -q)"

      - name: Check services files
        if: matrix.mode == 'full'
        run: |
          for service in traefik cfssl portainer; do
            test -f "$HOME/.docker-devbox/$service/docker-compose.yml.jsonnet"
            test -f "$HOME/.docker-devbox/$service/docker-compose.yml"
          done
          test -f "$HOME/.docker-devbox/traefik/traefik.toml"
          test -f "$HOME/.docker-devbox/traefik/acme.json"
          test -d "$HOME/.docker-devbox/traefik/config"
          test -f "$HOME/.docker-devbox/traefik/.bash_enter.d/80-chmod-acme-json"

      - name: Check services are running
        if: matrix.mode == 'full'
        run: |
          for service in traefik cfssl portainer; do
            cd "$HOME/.docker-devbox/$service"
            if ! docker compose ps --status running --format '{{.Name}}' | grep -q .; then
              echo "no running container for $service"
              docker compose ps -a
              exit 1
            fi
          done

      - name: Check traefik answers on http
        if: matrix.mode == 'full'
        run: |
          for _ in $(seq 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost/ || true)"
            [[ "$code" != "000" ]] && break
            sleep 2
          done
          echo "traefik answered with status $code"
          [[ "$code" != "000" ]]

      - name: Check portainer is routed through traefik
        if: matrix.mode == 'full'
        run: |
          host="$(docker inspect portainer --format '{{json .Config.Labels}}' | grep -oP 'Host\(`\K[^`]+' | head -1)"
          echo "portainer is exposed as $host"
          test -n "$host"
          for _ in $(seq 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $host" http://localhost/ || true)"
            [[ "$code" =~ ^(200|30[0-9])$ ]] && break
            sleep 2
          done
          echo "portainer answered with status $code"
          [[ "$code" =~ ^(200|30[0-9])$ ]]

      - name: Check cfssl answers on its published port
        if: matrix.mode == 'full'
        run: |
          for _ in $(seq 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7780/api/v1/cfssl/health || true)"
            [[ "$code" != "000" ]] && break
            sleep 2
          done
          echo "cfssl answered with status $code: $(curl -s http://localhost:7780/api/v1/cfssl/health || true)"
          [[ "$code" != "000" ]]

      - name: Upgrade services
        if: matrix.mode == 'full'
        run: |
          marker="# ci-upgrade-marker"

          if [[ "${{ matrix.source }}" == "repository" ]]; then
            SOURCES="$RUNNER_TEMP/sources"
            echo "$marker" >> "$SOURCES/services/traefik/ddb.yml"
            git -C "$SOURCES" -c user.email=ci@example.com -c user.name=ci commit -qam "ci upgrade"
            git -C "$SOURCES" push -q "$RUNNER_TEMP/docker-devbox.git" ci
            bash < ./upgrade
          else
            echo "$marker" >> services/traefik/ddb.yml
            ./upgrade
          fi

          grep -q "$marker" "$HOME/.docker-devbox/traefik/ddb.yml"
          test -f "$HOME/.docker-devbox/traefik/acme.json"
          cd "$HOME/.docker-devbox/traefik"
          docker compose ps --status running --format '{{.Name}}' | grep -q .

      - name: Uninstall
        run: |
          ./uninstaller
          test ! -e "$HOME/.docker-devbox"
          test -z "$(docker ps -q)"

      - name: Dump logs
        if: failure()
        run: |
          cat "$HOME/.docker-devbox/docker-devbox-installer.log" || true
          docker ps -a || true
          for service in traefik cfssl portainer; do
            [[ -d "$HOME/.docker-devbox/$service" ]] || continue
            echo "::group::$service"
            (cd "$HOME/.docker-devbox/$service" && docker compose logs --tail 50) || true
            echo "::endgroup::"
          done

  certs:
    name: Certificates generation
    runs-on: ubuntu-latest
    env:
      DOCKER_DEVBOX_CURL_OPTS_GITHUB_API: -u x-access-token:${{ github.token }}
      DOCKER_DEVBOX_DISABLE_PORTAINER: 1
      DOMAIN: devbox-test.test
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: |
          ./installer
          echo "$HOME/.docker-devbox/bin" >> "$GITHUB_PATH"

      - name: Configure the test project
        run: |
          project="$RUNNER_TEMP/project"
          cp -a tests/project "$project"
          echo "PROJECT=$project" >> "$GITHUB_ENV"
          cd "$project"
          ddb configure

      - name: Check the certificate issued by cfssl
        run: |
          cd "$PROJECT"
          test -f ".certs/$DOMAIN.crt"
          test -f ".certs/$DOMAIN.key"

          openssl x509 -in ".certs/$DOMAIN.crt" -noout -subject | grep -qE "CN *= *$DOMAIN"
          openssl x509 -in ".certs/$DOMAIN.crt" -noout -ext subjectAltName | grep -q "DNS:$DOMAIN"
          openssl x509 -in ".certs/$DOMAIN.crt" -noout -ext subjectAltName | grep -q "DNS:\*\.$DOMAIN"
          openssl x509 -in ".certs/$DOMAIN.crt" -noout -checkend 0

          # append_ca_certificate defaults to true, so the issuing CA is bundled with the certificate
          test "$(grep -c 'BEGIN CERTIFICATE' ".certs/$DOMAIN.crt")" -ge 2

          # the private key must match the certificate
          diff <(openssl x509 -in ".certs/$DOMAIN.crt" -noout -pubkey) <(openssl pkey -in ".certs/$DOMAIN.key" -pubout)

          openssl x509 -in ".certs/$DOMAIN.crt" -noout -subject -issuer -dates

      - name: Check the certificate is installed in traefik
        run: |
          test -f "$HOME/.docker-devbox/certs/$DOMAIN.crt"
          test -f "$HOME/.docker-devbox/certs/$DOMAIN.key"
          cmp "$PROJECT/.certs/$DOMAIN.crt" "$HOME/.docker-devbox/certs/$DOMAIN.crt"
          grep -q "$DOMAIN" "$HOME/.docker-devbox/traefik/config/$DOMAIN.ssl.toml"

      - name: Check https access through traefik
        run: |
          cd "$HOME/.docker-devbox/cfssl"
          docker compose cp intermediate:/etc/cfssl/ca.pem "$RUNNER_TEMP/ca.pem"

          cd "$PROJECT"
          docker compose up -d --wait || docker compose up -d

          for _ in $(seq 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --cacert "$RUNNER_TEMP/ca.pem" \
              --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/" || true)"
            [[ "$code" == "200" ]] && break
            sleep 2
          done

          echo "https://$DOMAIN answered with status $code, certificate validated against the cfssl CA"
          [[ "$code" == "200" ]]

      - name: Dump logs
        if: failure()
        run: |
          cat "$HOME/.docker-devbox/docker-devbox-installer.log" || true
          docker ps -a || true
          ls -la "$PROJECT/.certs" || true
          cat "$HOME/.docker-devbox/traefik/config/$DOMAIN.ssl.toml" || true
          echo | openssl s_client -connect 127.0.0.1:443 -servername "$DOMAIN" 2>&1 | head -30 || true
          for service in traefik cfssl; do
            echo "::group::$service"
            (cd "$HOME/.docker-devbox/$service" && docker compose logs --tail 50) || true
            echo "::endgroup::"
          done
          echo "::group::project"
          (cd "$PROJECT" && docker compose logs --tail 50) || true
          echo "::endgroup::"
